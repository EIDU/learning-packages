name: CI

on:
  push:
    branches:
      - '*'

jobs:
  Publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Check
        run: ./gradlew check --stacktrace

      - name: Publish reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports
